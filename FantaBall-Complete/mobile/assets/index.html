<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FantaBall</title><style>*{box-sizing:border-box}:root{--bg:#f5f6f8;--surface:#fff;--ink:#16232b;--muted:#5e6d79;--line:#dfe6e9;--accent:#155b45;--soft:#e8f2ec}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:15px;padding:12px 17px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{opacity:.7}h1{font-size:36px;letter-spacing:-1.3px;line-height:1.15;margin:8px 0}h2{font-size:27px;letter-spacing:-.8px;margin:9px 0}h3{font-size:18px;margin:4px 0}p{margin:8px 0}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 24px 110px}.head{padding:28px 0 18px}.eye{font-size:11px;font-weight:750;letter-spacing:1.8px;color:var(--accent)}.muted{font-size:14px;color:var(--muted)}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.hero{background:var(--soft);padding:25px;border-radius:28px;margin:16px 0 22px}.card{background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:20px;margin:13px 0}.metrics{display:flex;gap:16px;margin:20px 0 8px;flex-wrap:wrap}.metric{flex:1;min-width:70px}.metric strong{display:block;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.8px}.metric span{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-height:52px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:15px}.field{margin:13px 0}.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.badge{font-size:11px;font-weight:650;background:var(--soft);color:var(--accent);padding:7px 11px;border-radius:20px}.demo{background:#fcf0d8;color:#77521b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.primary{background:var(--accent);color:white}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);background:var(--surface);border-top:1px solid var(--line);display:flex;padding:9px 12px calc(12px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;color:var(--muted);padding:10px 4px;font-size:12px}.nav button.active{color:var(--accent);background:var(--soft)}.bubble{padding:17px 19px;border:1px solid var(--line);background:var(--surface);border-radius:20px;margin:13px 20px 13px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:30px;margin-right:0;background:var(--soft)}.chips{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.chips .active{background:var(--accent);color:white}.band{height:6px;background:var(--line);border-radius:8px;margin:18px 0 10px}.band:after{content:'';display:block;margin:auto;width:68%;height:6px;background:var(--accent);border-radius:8px;opacity:.65}.fixture{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line)}.notice{padding:14px;border-radius:15px;background:#fcf0d8;color:#77521b;font-size:13px}.hidden{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#10171b;--surface:#1b252b;--ink:#f0f5f6;--muted:#acbdc7;--line:#35444d;--accent:#a3e4c7;--soft:#223b31}.primary,.chips .active{color:#10271c}.demo,.notice{background:#352d1f;color:#efcd8b}}@media(prefers-reduced-motion:no-preference){button{transition:opacity .15s}}@media(max-width:360px){.app{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app" id="root"></main><nav id="nav" class="nav hidden" aria-label="Main navigation"></nav><script>function rng(seed){let x=seed>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return(x+.5)/4294967296}}
function normal(r){return Math.sqrt(-2*Math.log(r()))*Math.cos(2*Math.PI*r())}
function poisson(l,r){let p=1,k=0;do{k++;p*=r()}while(p>Math.exp(-Math.max(0,l))&&k<80);return k-1}
function quantile(a,q){let s=[...a].sort((a,b)=>a-b);return s[Math.floor((s.length-1)*q)]}
function validate(c){for(let k of ['teams','budget','min','rounds','P','D','C','A'])if(!Number.isInteger(c[k])||c[k]<1)throw Error('Positive whole numbers required: '+k);if(c.rounds>60)throw Error('Maximum 60 demo fixtures');if(c.budget<c.min*(c.P+c.D+c.C+c.A))throw Error('Budget cannot fill squad');for(let k of ['goal','assist','yellow','conceded','clean'])if(!Number.isFinite(c[k])||c[k]<0)throw Error('Invalid scoring value');if(!c.competition||!c.season)throw Error('Competition and season required');return c}
function simulate(c,N=1000){validate(c);let r=rng(82);let ps=['P','D','C','A'].flatMap(role=>Array.from({length:18},(_,i)=>({id:role+i,name:'Demo '+role+' '+String(i+1).padStart(2,'0'),team:'Demo club '+(i%12+1),role,fit:.78+r()*.2,sel:.48+r()*.5,base:5.8+r()*.5,g:role==='A'?.18+r()*.4:role==='C'?.08+r()*.18:role==='D'?.02+r()*.07:0,a:role==='P'?0:.03+r()*.15,injury:i===4?3:0,prices:[],points:[],games:[],fixtures:Array.from({length:c.rounds},(_,g)=>({round:g+1,home:g%2===0,opponent:'Demo opponent '+(g%12+1),def:.7+(g*7%13)/13,attack:.7+(g*5%13)/13}))})));let discretionary=c.budget-c.min*(c.P+c.D+c.C+c.A);for(let s=0;s<N;s++){let shocks=Array.from({length:c.rounds},()=>normal(r)*.12),values=ps.map(p=>{let quality=Math.exp(normal(r)*.18),fit=Math.min(.99,Math.max(.1,p.fit+normal(r)*.05)),sel=Math.min(.99,Math.max(.05,p.sel+normal(r)*.06)),injury=p.injury,total=0,games=0;for(let f of p.fixtures){if(injury){injury--;continue}if(r()>fit){injury=Math.floor(r()*3);continue}if(r()>sel)continue;games++;let home=f.home?1.12:.9,v=p.base+normal(r)*.45,attack=home/f.def*Math.exp(shocks[f.round-1]);if(p.role==='P'){let goals=poisson(1.1*f.attack/home,r);v-=goals*c.conceded;if(!goals)v+=c.clean}else v+=poisson(p.g*quality*attack,r)*c.goal+poisson(p.a*quality*attack,r)*c.assist;if(r()<.14)v-=c.yellow;total+=v}p.points.push(total);p.games.push(games);return total}),vor=ps.map(()=>0);for(let role of ['P','D','C','A']){let ids=ps.map((p,i)=>p.role===role?i:-1).filter(i=>i>=0),sorted=ids.map(i=>values[i]).sort((a,b)=>b-a),cut=Math.min(sorted.length-1,Math.max(1,Math.floor(c.teams*c[role]*.65)));ids.forEach(i=>vor[i]=Math.max(0,values[i]-sorted[cut]))}let sum=vor.reduce((a,b)=>a+b,0);ps.forEach((p,i)=>p.prices.push(c.min+(sum?discretionary*vor[i]/sum:0)))}let avg=a=>a.reduce((x,y)=>x+y,0)/a.length;return ps.map(p=>({...p,expected:avg(p.points),rated:avg(p.games),xfm:avg(p.games)?avg(p.points)/avg(p.games):0,glo:quantile(p.games,.1),ghi:quantile(p.games,.9),low:quantile(p.prices,.1),median:quantile(p.prices,.5),high:quantile(p.prices,.9),target:Math.floor(quantile(p.prices,c.risk==='conservative'?.25:c.risk==='upside'?.65:.5))}))}
function squad(c,ledger,players){let mine=ledger.filter(e=>e.owner==='me'),spent=mine.reduce((s,e)=>s+e.price,0),slots=Object.fromEntries(['P','D','C','A'].map(r=>[r,c[r]]));mine.forEach(e=>{let p=players.find(p=>p.id===e.pid);if(p)slots[p.role]--});let empty=Object.values(slots).reduce((a,b)=>a+b,0);return{mine,spent,left:c.budget-spent,slots,legal:Math.max(0,c.budget-spent-c.min*Math.max(0,empty-1))}}
function purchase(c,ledger,ps,pid,price,owner){let p=ps.find(p=>p.id===pid);if(!p)throw Error('Unknown player');if(ledger.some(e=>e.pid===pid))throw Error('Already purchased');if(!Number.isInteger(price)||price<c.min)throw Error('Invalid price');if(owner==='me'){let s=squad(c,ledger,ps);if(s.slots[p.role]<1||price>s.legal)throw Error('Role full or illegal budget')}return [...ledger,{pid,price,owner,at:new Date().toISOString()}]}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved={};try{saved=JSON.parse(localStorage.getItem('fantaball-complete')||'{}')}catch{}let S={config:saved.config||null,ledger:saved.ledger||[],history:saved.history||[],server:saved.server||'',tab:'players',selected:null,role:'All',query:'',offer:1,players:[],busy:false};function save(){try{localStorage.setItem('fantaball-complete',JSON.stringify({config:S.config,ledger:S.ledger,history:S.history,server:S.server}))}catch{alert('Local storage unavailable')}}function st(){return squad(S.config,S.ledger,S.players)}function sel(){return S.players.find(p=>p.id===S.selected)}function taken(id){return S.ledger.some(e=>e.pid===id)}function metric(l,v){return `<div class="metric"><strong>${esc(v)}</strong><span>${esc(l)}</span></div>`}function advice(p){let s=st(),stop=!taken(p.id)&&s.slots[p.role]>0?Math.min(p.target,s.legal):0;return{stop,decision:S.offer<=stop?'BID WITH DISCIPLINE':'LEAVE THIS BID',prob:p.prices.filter(x=>x>=S.offer).length/p.prices.length,alternatives:S.players.filter(x=>x.role===p.role&&x.id!==p.id&&!taken(x.id)).sort((a,b)=>b.expected/Math.max(1,b.target)-a.expected/Math.max(1,a.target)).slice(0,3)}}function go(tab){S.tab=tab;if(tab==='players')S.selected=null;render();window.scrollTo(0,0)}function openPlayer(id){S.selected=id;S.tab='profile';render();window.scrollTo(0,0)}
function field(k,l,type='number'){return `<div class="field"><label for="${k}">${l}</label><input id="${k}" name="${k}" type="${type}" required ${type==='number'?'min="0" step="any"':''}></div>`}function setup(){return `<div class="head"><div class="eye">YOUR EDGE. YOUR LEAGUE.</div><h1>FantaBall</h1></div><div class="hero"><h2>Build a smarter squad.</h2><p class="muted">Set the rules. Find the value. Stay in control.</p></div><p class="notice">Synthetic demo only. Simple Classic scoring; no defence modifier or lineup optimizer.</p><form id="setup">${field('competition','Competition','text')}${field('season','Season','text')}<div class="grid">${[['teams','Participants'],['budget','Budget'],['min','Minimum bid'],['rounds','Remaining fixtures'],['P','Goalkeeper slots'],['D','Defender slots'],['C','Midfielder slots'],['A','Attacker slots'],['goal','Goal bonus'],['assist','Assist bonus'],['yellow','Yellow penalty'],['conceded','Keeper conceded penalty'],['clean','Clean-sheet bonus']].map(([k,l])=>field(k,l)).join('')}</div><div class="field"><label for="risk">Risk preference</label><select name="risk" id="risk"><option value="balanced">Balanced</option><option value="conservative">Conservative</option><option value="upside">Upside-oriented</option></select></div><div class="actions"><button type="button" onclick="preset()">Fill demo preset</button><button class="primary">Create workspace</button></div></form>`}function preset(){let c={competition:'Serie A — DEMO',season:'2026/27',teams:12,budget:500,min:1,rounds:38,P:3,D:8,C:8,A:6,goal:3,assist:1,yellow:.5,conceded:1,clean:1};Object.entries(c).forEach(([k,v])=>document.getElementById(k).value=v)}
function card(p){return `<article class="card"><div class="row"><h3>${p.name}</h3><span class="badge">${p.role}${taken(p.id)?' · SOLD':''}</span></div><p class="muted">${p.team}</p><div class="metrics">${metric('Expected xFM',p.xfm.toFixed(2))}${metric('Rated games',p.rated.toFixed(1))}${metric('Target credits',p.target)}</div><div class="band" aria-hidden="true"></div><p class="muted">P10–P90 model price · ${p.low.toFixed(0)}–${p.high.toFixed(0)} credits</p><button onclick="openPlayer('${p.id}')">View player</button></article>`}function list(){return S.players.filter(p=>(S.role==='All'||p.role===S.role)&&(p.name+' '+p.team).toLowerCase().includes(S.query.toLowerCase())).sort((a,b)=>b.median-a.median).map(card).join('')||'<p>No matching players.</p>'}function playersPage(){let s=st();return `<div class="hero"><div class="eye">THE VALUE BOARD</div><h2>Great teams start<br>with better decisions.</h2><p class="muted">Fixture-aware forecasts. A clearer price for every player.</p><div class="metrics">${metric('Credits available',s.left)}${metric('Players signed',s.mine.length)}</div></div><input id="search" type="search" aria-label="Search players or clubs" placeholder="Search players or clubs" value="${esc(S.query)}"><div class="chips">${['All','P','D','C','A'].map(r=>`<button class="${r===S.role?'active':''}" onclick="S.role='${r}';render()">${r}</button>`).join('')}</div><div id="list">${list()}</div>`}function profile(){let p=sel();if(!p)return playersPage();return `<button onclick="go('players')">← All players</button>${card(p)}<div class="card"><div class="metrics">${metric('Fitness input',(100*p.fit).toFixed(0)+'%')}${metric('Rating reliability proxy',(100*p.fit*p.sel).toFixed(0)+'%')}</div><p class="muted">Expected rated games ${p.rated.toFixed(1)} (${p.glo}–${p.ghi}). Low-confidence, uncalibrated demo.</p><div class="actions"><button onclick="go('chat')">Ask advisor</button><button class="primary" onclick="go('live')">Evaluate bid</button></div></div><div class="card"><h3>The calendar</h3>${p.fixtures.map(f=>`<div class="fixture row"><span>R${f.round} · ${f.opponent}<br><span class="muted">Attack ${f.attack.toFixed(2)} · defence ${f.def.toFixed(2)}</span></span><span class="badge">${f.home?'Home':'Away'}</span></div>`).join('')}</div>`}
function decision(){let p=sel(),a=advice(p),s=st();return `<div class="hero"><div class="eye">YOUR NEXT MOVE</div><h2>${a.decision}</h2><div class="metrics">${metric('Target',p.target)}${metric('Hard stop',a.stop)}${metric('Credits left',s.left)}</div></div><p class="muted">xFM ${p.xfm.toFixed(2)} · rated games ${p.rated.toFixed(1)} (${p.glo}–${p.ghi})<br>Price band ${p.low.toFixed(0)}–${p.high.toFixed(0)}. Model value ≥ bid ${(100*a.prob).toFixed(0)}%; not probability of winning.</p>`}function live(){let p=sel();if(!p)return '<div class="hero"><h2>Ready when you are.</h2><p>Select a player first.</p><button onclick="go(\'players\')">Find a player</button></div>';let a=advice(p);return `<h2>${p.name}</h2><div class="field"><label for="offer">Current offer / confirmed purchase price</label><input id="offer" type="number" min="1" step="1" value="${S.offer}"></div><div id="decision">${decision()}</div><div class="actions"><button class="primary" onclick="buy('me')">Record my purchase</button><button onclick="buy('opponent')">Opponent bought</button></div><div class="card"><h3>Another way to build</h3><p class="muted">Simple available same-role screening, not optimized package value.</p>${a.alternatives.map(p=>`<button style="margin:8px" onclick="S.selected='${p.id}';render()">${p.name} · target ${p.target}</button>`).join('')}</div>${chatPage('Auction copilot')}`}
function chatPage(title='A clearer next move.'){return `<h2>${title}</h2><p class="muted">${S.server?'Claude server configured':'Offline rules assistant — not AI'}${sel()?' · '+sel().name:''}</p>${S.history.filter(h=>h.mode===S.tab).map(h=>`<div class="bubble ${h.role==='user'?'user':''}"><div class="eye">${h.role==='user'?'YOU':'FANTABALL ADVISOR'}</div>${esc(h.content)}</div>`).join('')}<form id="chat"><textarea id="message" rows="2" aria-label="Message to adviser" placeholder="Ask about your next move…" required></textarea><div class="actions"><button class="primary" ${S.busy?'disabled':''}>${S.busy?'Thinking…':'Send'}</button></div></form>`}
function squadPage(){let s=st();return `<div class="hero"><div class="eye">BUILD WITH INTENTION</div><h2>Your squad, in focus.</h2><div class="metrics">${metric('Credits left',s.left)}${metric('Spent',s.spent)}${metric('Signed',s.mine.length)}</div><p class="muted">Legal next purchase ≤ ${s.legal}</p></div><div class="card"><h3>Open positions</h3><div class="metrics">${Object.entries(s.slots).map(([r,v])=>metric(r,v)).join('')}</div></div>${s.mine.map(e=>`<div class="card row"><h3>${S.players.find(p=>p.id===e.pid).name}</h3><span class="badge">${e.price} credits</span></div>`).join('')||'<p class="muted">Your first confirmed purchase starts the story.</p>'}<p class="muted">Budget/slots update live. No lineup-optimized team evaluation yet.</p><div class="actions"><button onclick="undo()">Undo last purchase</button><button onclick="exportState()">Export workspace</button></div><div class="card"><h3>Development chat connection</h3><p class="muted">Production users will not need this setting or an API key.</p><input id="server" type="url" aria-label="Chat server URL" value="${esc(S.server)}" placeholder="http://192.168.1.10:8000"><button style="margin-top:12px" onclick="S.server=document.getElementById('server').value.trim();save();alert('Saved')">Save connection</button></div><button onclick="reset()">Reset local workspace</button>`}
function render(){let nav=document.getElementById('nav');nav.classList.toggle('hidden',!S.config);if(!S.config){document.getElementById('root').innerHTML=setup();document.getElementById('setup').onsubmit=e=>{e.preventDefault();try{let c=Object.fromEntries(new FormData(e.target));for(let k of ['teams','budget','min','rounds','P','D','C','A','goal','assist','yellow','conceded','clean'])c[k]=Number(c[k]);validate(c);S.players=simulate(c);S.config=c;save();render()}catch(e){alert(e.message)}};return}nav.innerHTML=[['players','◈ Players'],['chat','◌ Advisor'],['live','◎ Live'],['squad','▦ Squad']].map(([k,l])=>`<button aria-current="${S.tab===k?'page':'false'}" class="${S.tab===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');let title={players:'Discover',profile:'Player profile',chat:'Advisor',live:'Live auction',squad:'Your squad'}[S.tab];document.getElementById('root').innerHTML=`<header class="head"><div class="eye">FANTABALL</div><div class="row"><h1>${title}</h1><span class="badge demo">DEMO</span></div><p class="muted">${esc(S.config.competition)} · ${esc(S.config.season)}</p></header>`+(S.tab==='players'?playersPage():S.tab==='profile'?profile():S.tab==='live'?live():S.tab==='squad'?squadPage():chatPage());let search=document.getElementById('search');if(search)search.oninput=e=>{S.query=e.target.value;document.getElementById('list').innerHTML=list()};let offer=document.getElementById('offer');if(offer)offer.oninput=e=>{S.offer=Math.max(1,Number(e.target.value)||1);document.getElementById('decision').innerHTML=decision()};let chat=document.getElementById('chat');if(chat)chat.onsubmit=send}
function buy(owner){try{let p=sel();purchase(S.config,S.ledger,S.players,p.id,S.offer,owner);if(!confirm(`Record ${p.name} at ${S.offer} credits for ${owner==='me'?'your squad':'opponent'}?`))return;S.ledger=purchase(S.config,S.ledger,S.players,p.id,S.offer,owner);save();render()}catch(e){alert(e.message)}}function undo(){if(S.ledger.length&&confirm('Undo last purchase?')){S.ledger.pop();save();render()}}function reset(){if(confirm('Delete local league, purchases and chats?')){S.config=null;S.ledger=[];S.history=[];S.selected=null;save();render()}}function exportState(){let b=new Blob([JSON.stringify({config:S.config,ledger:S.ledger,history:S.history},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='FantaBall-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function send(e){e.preventDefault();if(S.busy)return;let text=document.getElementById('message').value.trim();if(!text)return;let mode=S.tab,p=sel(),s=st(),a=p?advice(p):null,history=S.history.filter(h=>h.mode===mode).slice(-10);S.history.push({role:'user',content:text,mode});S.busy=true;render();let answer;try{if(S.server){let res=await fetch(S.server.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history,context:{mode:mode==='live'?'live-auction':'advisor',data:'SYNTHETIC DEMO',config:S.config,squad:s,selectedPlayer:p?{name:p.name,role:p.role,xfm:p.xfm,rated:p.rated,range:[p.glo,p.ghi],target:p.target,priceRange:[p.low,p.high]}:null,advice:a?{stop:a.stop,decision:a.decision,alternatives:a.alternatives.map(x=>({name:x.name,target:x.target}))}:null}})});let d=await res.json();if(!res.ok)throw Error(d.detail||'Server error');answer=d.answer}else answer=p?`${a.decision}. Target ${p.target}, stop ${a.stop}; price band ${p.low.toFixed(0)}–${p.high.toFixed(0)}.\n\nxFM ${p.xfm.toFixed(2)}, expected rated games ${p.rated.toFixed(1)} (${p.glo}–${p.ghi}). Budget ${s.left}; open ${p.role} slots ${s.slots[p.role]}.\n\nAlternatives: ${a.alternatives.map(x=>x.name+' target '+x.target).join(', ')}.\n\nSynthetic demo; rule-based reply, not AI. Not lineup optimized.`:`Budget ${s.left}; open slots ${Object.entries(s.slots).map(([r,v])=>r+' '+v).join(', ')}. Select a player for contextual bid advice. Connect the development Claude server for real conversational replies. This reply is rule-based, not AI.`}catch(e){answer='Chat failed: '+e.message}S.history.push({role:'assistant',content:answer,mode});S.busy=false;save();render()}
if(S.config){try{S.players=simulate(S.config)}catch{S.config=null}}render();</script></body></html>
