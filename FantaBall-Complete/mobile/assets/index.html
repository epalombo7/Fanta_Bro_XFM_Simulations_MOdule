<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FantaBall</title><style>*{box-sizing:border-box}:root{--bg:#f5f6f8;--surface:#fff;--ink:#16232b;--muted:#5e6d79;--line:#dfe6e9;--accent:#155b45;--soft:#e8f2ec}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:15px;padding:12px 17px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{opacity:.7}h1{font-size:36px;letter-spacing:-1.3px;line-height:1.15;margin:8px 0}h2{font-size:27px;letter-spacing:-.8px;margin:9px 0}h3{font-size:18px;margin:4px 0}p{margin:8px 0}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 24px 110px}.head{padding:28px 0 18px}.eye{font-size:11px;font-weight:750;letter-spacing:1.8px;color:var(--accent)}.muted{font-size:14px;color:var(--muted)}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.hero{background:var(--soft);padding:25px;border-radius:28px;margin:16px 0 22px}.card{background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:20px;margin:13px 0}.metrics{display:flex;gap:16px;margin:20px 0 8px;flex-wrap:wrap}.metric{flex:1;min-width:70px}.metric strong{display:block;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.8px}.metric span{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-height:52px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:15px}.field{margin:13px 0}.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.badge{font-size:11px;font-weight:650;background:var(--soft);color:var(--accent);padding:7px 11px;border-radius:20px}.demo{background:#fcf0d8;color:#77521b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.primary{background:var(--accent);color:white}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);background:var(--surface);border-top:1px solid var(--line);display:flex;padding:9px 12px calc(12px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;color:var(--muted);padding:10px 4px;font-size:12px}.nav button.active{color:var(--accent);background:var(--soft)}.bubble{padding:17px 19px;border:1px solid var(--line);background:var(--surface);border-radius:20px;margin:13px 20px 13px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:30px;margin-right:0;background:var(--soft)}.chips{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.chips .active{background:var(--accent);color:white}.band{height:6px;background:var(--line);border-radius:8px;margin:18px 0 10px}.band:after{content:'';display:block;margin:auto;width:68%;height:6px;background:var(--accent);border-radius:8px;opacity:.65}.fixture{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line)}.notice{padding:14px;border-radius:15px;background:#fcf0d8;color:#77521b;font-size:13px}.hidden{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#10171b;--surface:#1b252b;--ink:#f0f5f6;--muted:#acbdc7;--line:#35444d;--accent:#a3e4c7;--soft:#223b31}.primary,.chips .active{color:#10271c}.demo,.notice{background:#352d1f;color:#efcd8b}}@media(prefers-reduced-motion:no-preference){button{transition:opacity .15s}}@media(max-width:360px){.app{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app" id="root"></main><nav id="nav" class="nav hidden" aria-label="Main navigation"></nav><script src="engine.js"></script><script src="league.js"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved={};try{saved=JSON.parse(localStorage.getItem('fantaball-complete')||'{}')}catch{}let S={config:saved.config||null,ledger:saved.ledger||[],history:saved.history||[],server:saved.server||'',tab:'players',selected:null,role:'All',query:'',offer:1,players:[],busy:false};function save(){try{localStorage.setItem('fantaball-complete',JSON.stringify({config:S.config,ledger:S.ledger,history:S.history,server:S.server}))}catch{alert('Local storage unavailable')}}function st(){return squad(S.config,S.ledger,S.players)}function sel(){return S.players.find(p=>p.id===S.selected)}function taken(id){return S.ledger.some(e=>e.pid===id)}function metric(l,v){return `<div class="metric"><strong>${esc(v)}</strong><span>${esc(l)}</span></div>`}function alternatives(p){return S.players.filter(x=>x.role===p.role&&x.id!==p.id&&!taken(x.id)).sort((a,b)=>b.xfm-a.xfm).slice(0,3)}const pct=x=>(100*x).toFixed(0)+'%',f2=x=>x.toFixed(2),N_SIM=300,REAL=typeof LEAGUE_DATA!=='undefined'?LEAGUE_DATA:null;function run(c){let cc=REAL?{...c,rounds:Math.min(c.rounds,38-REAL.as_of_round)}:c;if(!S.season||S.seasonRounds!==cc.rounds){S.season=runSeason(cc,REAL?{N:N_SIM,league:REAL,model:REAL.model}:{N:N_SIM});S.seasonRounds=cc.rounds}return scoreSeason(S.season,cc).players} /* season simulated once; rule changes only re-score */function go(tab){S.tab=tab;if(tab==='players')S.selected=null;render();window.scrollTo(0,0)}function openPlayer(id){S.selected=id;S.tab='profile';render();window.scrollTo(0,0)}
// League setup and scoring-rules form. Every rule feeds config.rules, which the engine applies to all simulations.
const LEAGUE_FIELDS=[['teams','Participants'],['budget','Budget'],['min','Minimum bid'],['rounds','Remaining fixtures'],['P','Goalkeeper slots'],['D','Defender slots'],['C','Midfielder slots'],['A','Attacker slots']];
const RULE_FIELDS=[['goal.P','Goal — goalkeeper'],['goal.D','Goal — defender'],['goal.C','Goal — midfielder'],['goal.A','Goal — attacker'],['assist','Assist'],['penaltyScored','Penalty scored'],['penaltyMissed','Penalty missed'],['penaltySaved','Penalty saved (keeper)'],['ownGoal','Own goal'],['yellow','Yellow card'],['red','Red card'],['conceded','Goal conceded (keeper)'],['cleanSheet.P','Clean sheet — keeper'],['cleanSheet.D','Clean sheet — defender'],['cleanSheet.C','Clean sheet — midfielder'],['cleanSheet.A','Clean sheet — attacker'],['noVoteRed','Fantavoto if sent off without vote (blank = none)'],['noVoteYellow','Fantavoto if booked without vote (blank = none)'],['defenceModifier.minDefenders','Defence modifier: minimum defenders']];
const getPath=(o,k)=>k.split('.').reduce((x,y)=>x==null?x:x[y],o);
function setPath(o,k,v){let ks=k.split('.'),last=ks.pop();ks.reduce((x,y)=>x[y]=x[y]||{},o)[last]=v}
function field(k,l,type='number',v=''){return `<div class="field"><label for="${k}">${l}</label><input id="${k}" name="${k}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(v??'')}"></div>`}
function select(k,l,opts,v){return `<div class="field"><label for="${k}">${l}</label><select id="${k}" name="${k}">${opts.map(([o,t])=>`<option value="${o}" ${o===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
function setup(){let c=S.config||{},R=merge(RULES,c.rules||{}),bands=R.defenceModifier.bands.map(b=>b.join(':')).join(', ');return `<div class="head"><div class="eye">YOUR EDGE. YOUR LEAGUE.</div><h1>FantaBall</h1></div><div class="hero"><h2>${S.config?'Edit your league.':'Build a smarter squad.'}</h2><p class="muted">Set the rules. Every simulation scores players exactly as these rules say.</p></div><p class="notice">${REAL?`Real Serie A ${REAL.season} players and calendar, calibrated on data up to round ${REAL.as_of_round}.`:"Synthetic demo players."} The simulation forecasts xFM only — no prices.</p><form id="setup"><h3>League</h3>${field('competition','Competition','text',c.competition)}${field('season','Season','text',c.season)}<div class="grid">${LEAGUE_FIELDS.map(([k,l])=>field(k,l,'number',c[k])).join('')}</div><h3>Scoring rules</h3><p class="muted">Pre-filled with a standard Fantacalcio Classic set. Change any value to match your league; maluses are negative.</p><div class="grid">${select('roleSystem','Role system',[['classic','Classic'],['mantra','Mantra']],R.roleSystem)}${select('voteProvider','Vote provider',[['fantacalcio','Fantacalcio.it'],['statistico','Statistico'],['italia','Italia']],R.voteProvider)}${RULE_FIELDS.map(([k,l])=>field('r.'+k,l,'number',getPath(R,k))).join('')}</div><div class="field"><label><input type="checkbox" name="r.defenceModifier.enabled" style="width:auto;min-height:0" ${R.defenceModifier.enabled?'checked':''}> Defence modifier enabled</label></div>${field('r.bands','Defence modifier bands (average:bonus, …)','text',bands)}<div class="actions"><button type="button" onclick="preset()">Fill demo league</button>${S.config?'<button type="button" onclick="S.editing=false;render()">Cancel</button>':''}<button class="primary">${S.config?'Save and re-run':'Create workspace'}</button></div></form>`}
function readSetup(form){let d=new FormData(form),c={competition:d.get('competition'),season:d.get('season'),rules:{roleSystem:d.get('roleSystem'),voteProvider:d.get('voteProvider')}};for(let [k] of LEAGUE_FIELDS)c[k]=Number(d.get(k));for(let [k,l] of RULE_FIELDS){let v=d.get('r.'+k).trim();if(v===''&&!k.startsWith('noVote'))throw Error('Missing rule: '+l);setPath(c.rules,k,v===''?null:Number(v))}c.rules.defenceModifier.enabled=d.get('r.defenceModifier.enabled')==='on';c.rules.defenceModifier.bands=d.get('r.bands').split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.split(':').map(Number));return c}
function preset(){let c={competition:REAL?'Serie A':'Serie A — DEMO',season:REAL?REAL.season:'2026/27',teams:12,budget:500,min:1,rounds:REAL?38-REAL.as_of_round:38,P:3,D:8,C:8,A:6};Object.entries(c).forEach(([k,v])=>document.getElementById(k).value=v)}
function card(p){return `<article class="card"><div class="row"><h3>${p.name}</h3><span class="badge">${p.role}${taken(p.id)?' · SOLD':''}</span></div><p class="muted">${p.team}</p><div class="metrics">${metric('xFM',f2(p.xfm))}${metric('Rated games',p.rated.toFixed(1))}${metric('Season points',p.expected.toFixed(0))}</div><p class="muted">xFM middle 50% ${f2(p.xfmLow)}–${f2(p.xfmHigh)} · rated games ${p.glo}–${p.ghi}</p><button onclick="openPlayer('${p.id}')">View player</button></article>`}function list(){return S.players.filter(p=>(S.role==='All'||p.role===S.role)&&(p.name+' '+p.team).toLowerCase().includes(S.query.toLowerCase())).sort((a,b)=>b.xfm-a.xfm).map(card).join('')||'<p>No matching players.</p>'}function playersPage(){let s=st();return `<div class="hero"><div class="eye">THE VALUE BOARD</div><h2>Great teams start<br>with better decisions.</h2><p class="muted">Match-by-match, team-based xFM forecasts.</p><div class="metrics">${metric('Credits available',s.left)}${metric('Players signed',s.mine.length)}</div></div><input id="search" type="search" aria-label="Search players or clubs" placeholder="Search players or clubs" value="${esc(S.query)}"><div class="chips">${['All','P','D','C','A'].map(r=>`<button class="${r===S.role?'active':''}" onclick="S.role='${r}';render()">${r}</button>`).join('')}</div><div id="list">${list()}</div>`}function profile(){let p=sel();if(!p)return playersPage();return `<button onclick="go('players')">← All players</button>${card(p)}<div class="card"><div class="metrics">${metric('Integrità',pct(p.integrita))}${metric('Titolarità',pct(p.titolarita))}${metric('Avg vote',f2(p.vote))}</div><div class="metrics">${metric('Goals',p.goals.toFixed(1))}${metric('Assists',p.assists.toFixed(1))}${metric('Penalties',p.penScored.toFixed(1))}${metric('Own goals',p.ownGoals.toFixed(1))}</div><p class="muted">Integrità = share of fixtures physically fit. Titolarità = starts when fit and not suspended. Synthetic, uncalibrated demo.</p><div class="actions"><button onclick="go('chat')">Ask advisor</button><button class="primary" onclick="go('live')">Evaluate bid</button></div></div>${corrCard(p)}${calendarCard(p)}`}
function decision(){let p=sel(),s=st();return `<div class="hero"><div class="eye">FORECAST</div><div class="metrics">${metric('xFM',f2(p.xfm))}${metric('Rated games',p.rated.toFixed(1))}${metric('Credits left',s.left)}${metric('Legal max',s.legal)}</div></div><p class="muted">xFM middle 50% ${f2(p.xfmLow)}–${f2(p.xfmHigh)} · rated games ${p.glo}–${p.ghi}. Price guidance is not modelled yet.</p>`}function live(){let p=sel();if(!p)return '<div class="hero"><h2>Ready when you are.</h2><p>Select a player first.</p><button onclick="go(\'players\')">Find a player</button></div>';return `<h2>${p.name}</h2><div class="field"><label for="offer">Current offer / confirmed purchase price</label><input id="offer" type="number" min="1" step="1" value="${S.offer}"></div><div id="decision">${decision()}</div><div class="actions"><button class="primary" onclick="buy('me')">Record my purchase</button><button onclick="buy('opponent')">Opponent bought</button></div><div class="card"><h3>Another way to build</h3><p class="muted">Highest-xFM available players in the same role.</p>${alternatives(p).map(p=>`<button style="margin:8px" onclick="S.selected='${p.id}';render()">${p.name} · xFM ${f2(p.xfm)}</button>`).join('')}</div>${chatPage('Auction copilot')}`}
function chatPage(title='A clearer next move.'){return `<h2>${title}</h2><p class="muted">${S.server?'Claude server configured':'Offline rules assistant — not AI'}${sel()?' · '+sel().name:''}</p>${S.history.filter(h=>h.mode===S.tab).map(h=>`<div class="bubble ${h.role==='user'?'user':''}"><div class="eye">${h.role==='user'?'YOU':'FANTABALL ADVISOR'}</div>${esc(h.content)}</div>`).join('')}<form id="chat"><textarea id="message" rows="2" aria-label="Message to adviser" placeholder="Ask about your next move…" required></textarea><div class="actions"><button class="primary" ${S.busy?'disabled':''}>${S.busy?'Thinking…':'Send'}</button></div></form>`}
function corrCell(r){if(r!==r)return '<td class="muted">–</td>';let a=Math.min(1,Math.abs(r))*.55,bg=r>0?`rgba(200,80,60,${a})`:`rgba(40,150,100,${a})`;return `<td style="background:${bg};text-align:center;font-variant-numeric:tabular-nums">${r.toFixed(2)}</td>`}
function corrList(xs){return xs.map(x=>`<div class="fixture row"><span>${esc(x.name)}<br><span class="muted">${esc(x.team)} · ${x.role}</span></span><span class="badge">${x.r>0?'+':''}${x.r.toFixed(2)}</span></div>`).join('')||'<p class="muted">Not enough simulated matches together.</p>'}
function corrCard(p){if(!S.season)return '';let with_=correlationRow(S.season,S.config,p.id).filter(x=>x.team===p.team).slice(0,5),h2h=correlationRow(S.season,S.config,p.id,{level:'head_to_head'}).filter(x=>x.team!==p.team&&x.r<0).slice(-5).reverse();
  return `<div class="card"><h3>Starting him alongside…</h3><p class="muted">Correlation of fantavoto in the same round, from the simulated seasons. Positive: they rise and fall together, so starting both adds risk. Negative: one tends to do well when the other does badly, a hedge.</p><h3 style="margin-top:14px">Moves with, at his club</h3>${corrList(with_)}<h3 style="margin-top:14px">Hedges, when their clubs meet</h3>${corrList(h2h)}</div>`}
function squadCorr(s){if(!S.season||s.mine.length<2)return '';let ids=s.mine.map(e=>e.pid),C=correlations(S.season,S.config,{ids}),n=C.ids.length,short=x=>esc(x.length>10?x.slice(0,9)+'.':x);
  return `<div class="card"><h3>How your players move together</h3><p class="muted">Same-round fantavoto correlation. Red: rise and fall together (risk if started together). Green: hedge each other.</p><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px"><tr><th></th>${C.names.map(x=>`<th style="padding:4px;writing-mode:vertical-rl;transform:rotate(180deg)">${short(x)}</th>`).join('')}</tr>${C.names.map((x,a)=>`<tr><th style="text-align:left;padding:4px;white-space:nowrap">${short(x)} <span class="muted">${C.roles[a]}</span></th>${Array.from({length:n},(_,b)=>a===b?'<td style="text-align:center">·</td>':corrCell(C.matrix[a*n+b])).join('')}</tr>`).join('')}</table></div></div>`}
function calendarCard(p){let md=S.season&&S.season.md?scoreMatchdays(S.season,S.config,[p.id])[0].matchdays:null,f1=x=>x===null?'–':x.toFixed(1);
  return `<div class="card"><h3>Matchday by matchday</h3><p class="muted">Expected fantavoto if he gets a vote, the range of the middle half of simulated matches, and his chance of a vote.</p>${p.fixtures.map((f,k)=>{let m=md&&md[k];return `<div class="fixture row"><span>R${f.round} · ${esc(f.opponent)} <span class="muted">${f.home?'(H)':'(A)'}</span><br><span class="muted">${m?`50%: ${f1(m.low)}–${f1(m.high)} · vote ${Math.round(100*m.pVote)}%`:`Opponent attack ${f2(f.attack)} · defence ${f2(f.def)}`}</span></span><span class="badge">${m&&m.xfm!==null?'xFM '+m.xfm.toFixed(2):f.home?'Home':'Away'}</span></div>`}).join('')}</div>`}
function squadPage(){let s=st();return `<div class="hero"><div class="eye">BUILD WITH INTENTION</div><h2>Your squad, in focus.</h2><div class="metrics">${metric('Credits left',s.left)}${metric('Spent',s.spent)}${metric('Signed',s.mine.length)}</div><p class="muted">Legal next purchase ≤ ${s.legal}</p></div><div class="card"><h3>Open positions</h3><div class="metrics">${Object.entries(s.slots).map(([r,v])=>metric(r,v)).join('')}</div></div>${s.mine.map(e=>`<div class="card row"><h3>${S.players.find(p=>p.id===e.pid).name}</h3><span class="badge">${e.price} credits</span></div>`).join('')||'<p class="muted">Your first confirmed purchase starts the story.</p>'}${squadCorr(s)}<p class="muted">Budget/slots update live. No lineup-optimized team evaluation yet.</p><div class="actions"><button onclick="undo()">Undo last purchase</button><button onclick="exportState()">Export workspace</button></div><div class="card"><h3>Development chat connection</h3><p class="muted">Production users will not need this setting or an API key.</p><input id="server" type="url" aria-label="Chat server URL" value="${esc(S.server)}" placeholder="http://192.168.1.10:8000"><button style="margin-top:12px" onclick="S.server=document.getElementById('server').value.trim();save();alert('Saved')">Save connection</button></div><div class="actions"><button onclick="S.editing=true;render();window.scrollTo(0,0)">Edit league and scoring rules</button><button onclick="reset()">Reset local workspace</button></div>`}
function render(){let nav=document.getElementById('nav');nav.classList.toggle('hidden',!S.config);if(!S.config||S.editing){nav.classList.add('hidden');document.getElementById('root').innerHTML=setup();document.getElementById('setup').onsubmit=e=>{e.preventDefault();try{let c=readSetup(e.target);validate(c);busy();setTimeout(()=>{try{S.players=run(c);S.config=c;S.editing=false;save()}catch(e){alert(e.message)}render()},30)}catch(e){alert(e.message)}};return}nav.innerHTML=[['players','◈ Players'],['chat','◌ Advisor'],['live','◎ Live'],['squad','▦ Squad']].map(([k,l])=>`<button aria-current="${S.tab===k?'page':'false'}" class="${S.tab===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');let title={players:'Discover',profile:'Player profile',chat:'Advisor',live:'Live auction',squad:'Your squad'}[S.tab];document.getElementById('root').innerHTML=`<header class="head"><div class="eye">FANTABALL</div><div class="row"><h1>${title}</h1><span class="badge demo">${REAL?"ROUND "+REAL.as_of_round:"DEMO"}</span></div><p class="muted">${esc(S.config.competition)} · ${esc(S.config.season)}</p></header>`+(S.tab==='players'?playersPage():S.tab==='profile'?profile():S.tab==='live'?live():S.tab==='squad'?squadPage():chatPage());let search=document.getElementById('search');if(search)search.oninput=e=>{S.query=e.target.value;document.getElementById('list').innerHTML=list()};let offer=document.getElementById('offer');if(offer)offer.oninput=e=>{S.offer=Math.max(1,Number(e.target.value)||1);document.getElementById('decision').innerHTML=decision()};let chat=document.getElementById('chat');if(chat)chat.onsubmit=send}
function buy(owner){try{let p=sel();purchase(S.config,S.ledger,S.players,p.id,S.offer,owner);if(!confirm(`Record ${p.name} at ${S.offer} credits for ${owner==='me'?'your squad':'opponent'}?`))return;S.ledger=purchase(S.config,S.ledger,S.players,p.id,S.offer,owner);save();render()}catch(e){alert(e.message)}}function undo(){if(S.ledger.length&&confirm('Undo last purchase?')){S.ledger.pop();save();render()}}function reset(){if(confirm('Delete local league, purchases and chats?')){S.config=null;S.ledger=[];S.history=[];S.selected=null;save();render()}}function exportState(){let b=new Blob([JSON.stringify({config:S.config,ledger:S.ledger,history:S.history},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='FantaBall-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function send(e){e.preventDefault();if(S.busy)return;let text=document.getElementById('message').value.trim();if(!text)return;let mode=S.tab,p=sel(),s=st(),alts=p?alternatives(p):[],history=S.history.filter(h=>h.mode===mode).slice(-10);S.history.push({role:'user',content:text,mode});S.busy=true;render();let answer;try{if(S.server){let res=await fetch(S.server.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history,context:{mode:mode==='live'?'live-auction':'advisor',data:'SYNTHETIC DEMO',config:S.config,squad:s,selectedPlayer:p?{name:p.name,team:p.team,role:p.role,xfm:p.xfm,xfmRange:[p.xfmLow,p.xfmHigh],rated:p.rated,ratedRange:[p.glo,p.ghi],integrita:p.integrita,titolarita:p.titolarita,goals:p.goals,assists:p.assists}:null,alternatives:alts.map(x=>({name:x.name,xfm:x.xfm}))}})});let d=await res.json();if(!res.ok)throw Error(d.detail||'Server error');answer=d.answer}else answer=p?`${p.name}: xFM ${f2(p.xfm)} (middle 50% ${f2(p.xfmLow)}–${f2(p.xfmHigh)}), expected rated games ${p.rated.toFixed(1)} (${p.glo}–${p.ghi}), integrità ${pct(p.integrita)}, titolarità ${pct(p.titolarita)}. Budget ${s.left}; open ${p.role} slots ${s.slots[p.role]}.\n\nHigher-xFM alternatives: ${alts.map(x=>x.name+' '+f2(x.xfm)).join(', ')}.\n\nSynthetic demo; rule-based reply, not AI. No price guidance.`:`Budget ${s.left}; open slots ${Object.entries(s.slots).map(([r,v])=>r+' '+v).join(', ')}. Select a player for their forecast. Connect the development Claude server for real conversational replies. This reply is rule-based, not AI.`}catch(e){answer='Chat failed: '+e.message}S.history.push({role:'assistant',content:answer,mode});S.busy=false;save();render()}
function busy(){document.getElementById('nav').classList.add('hidden');document.getElementById('root').innerHTML='<div class="hero"><h2>Simulating the season…</h2><p class="muted">'+N_SIM+' worlds, match by match.</p></div>'}if(S.config){busy();setTimeout(()=>{try{S.players=run(S.config)}catch{S.config=null}render()},30)}else render();</script></body></html>
