<title>FantaBall App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#2c2c2e; --label:#f5f5f7; --label2:#9e9ea6; --label3:#636368; --sep:rgba(84,84,88,.55);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --yellow:#ffd60a;
  --rP:#ff9f0a; --rD:#30d158; --rC:#64d2ff; --rA:#ff6961; --onrole:#000000; --bar:rgba(0,0,0,.8); --tab:rgba(22,22,24,.92); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#2c2c2e; --label:#f5f5f7; --label2:#9e9ea6; --label3:#636368; --sep:rgba(84,84,88,.55);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --yellow:#ffd60a;
  --rP:#ff9f0a; --rD:#30d158; --rC:#64d2ff; --rA:#ff6961; --onrole:#000000; --bar:rgba(0,0,0,.8); --tab:rgba(22,22,24,.92); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}

.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sel,.inp{flex:none;appearance:none;-webkit-appearance:none;border:0;background:var(--fill);color:var(--label);font:inherit;font-size:13px;font-weight:600;padding:6px 26px 6px 11px;border-radius:9px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}

.meter{width:40px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}.meter i{display:block;height:100%;border-radius:2px}

.grp{background:var(--card);border-radius:12px;overflow:hidden}

.tg{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--fill);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tg:checked{background:var(--green)}.tg:checked::after{transform:translateX(18px)}

.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.note{font-size:13px;line-height:1.45;color:var(--label2);padding:8px 4px}
.notebox{font-size:14px;line-height:1.45;background:var(--card);border-radius:12px;padding:12px 14px}
textarea{width:100%;min-height:88px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;resize:vertical}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;color:var(--label3);font:inherit;font-size:10px;font-weight:600;display:grid;justify-items:center;gap:2px;padding:4px 0;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--blue)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .22s}.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{left:50%;right:auto;width:640px;transform:translate(-50%,100%)}.sheet.on{transform:translate(-50%,0)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 4px;opacity:.6}
.sh-head{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;z-index:1}
.sh-head .role{width:40px;height:40px;font-size:17px}
.sh-name{font-family:var(--round);font-size:22px;font-weight:800;line-height:1.1}
.close{border:0;background:var(--fill);color:var(--label2);width:30px;height:30px;border-radius:50%;font-size:17px;font-weight:700;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:var(--card);border-radius:999px;padding:5px 10px;font-weight:500}.chip .t{color:var(--label2)}.chip b{margin-left:4px;font-variant-numeric:tabular-nums}
.add{border:0;background:var(--fill);color:var(--blue);width:30px;height:30px;border-radius:50%;font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center;flex:none}
.add.on{background:var(--blue);color:#fff}
.teams{display:flex;gap:6px;flex-wrap:wrap}
.xi .li{padding:8px 14px}

<script>
const DATA=/*DATA*/,SEEDS=/*SEEDS*/;
const M=DATA.meta,P=DATA.players,N=M.N,D=M.D,byId=new Map(P.map(p=>[p.id,p]));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const it=(x,k)=>x==null||!isFinite(x)?'–':x.toLocaleString('it-IT',{minimumFractionDigits:k,maximumFractionDigits:k});
const pct=x=>x==null?'–':(x<0.005&&x>0?'<1%':Math.round(x*100)+'%');
const roleName={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'},ROLES=['P','D','C','A'];
const FORMS=['3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-3-2','5-4-1'];
const fmtDate=s=>{if(!s)return 'n.d.';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('it-IT',{day:'numeric',month:'long'})};

// ---------- rules ----------
const RULES0={goal:{P:3,D:3,C:3,A:3},penScored:3,penMissed:-3,penSaved:3,ownGoal:-2,assist:1,yellow:-.5,red:-1,conceded:-1,cs:{P:1,D:0,C:0,A:0},
  noVoteRed:4,noVoteYellow:null,provider:0,defMod:{on:true,min:4,bands:[[6,1],[6.5,3],[7,6]]},formationChange:false,maxSubs:3,forms:[...FORMS],
  homeBonus:0,goalFirst:66,goalStep:6,captain:{on:false,bands:[[6.5,1],[7,2],[7.5,3]]},squad:{P:3,D:8,C:8,A:6}};
const PRESETS={'Classic standard':{},
  'Con modificatore e cambio modulo':{defMod:{on:true,min:4,bands:[[6,1],[6.5,3],[7,6]]},cs:{P:1,D:0,C:0,A:0},formationChange:true},
  'Senza modificatore, cambi per ruolo':{defMod:{on:false,min:4,bands:[[6,1],[6.5,3],[7,6]]},cs:{P:0,D:0,C:0,A:0},formationChange:false}};
const clone=o=>JSON.parse(JSON.stringify(o)),mk=over=>Object.assign(clone(RULES0),clone(over||{}));

// ---------- private storage on this phone ----------
let store={teams:[],cur:null,tab:'giornata',out:{}};
function load(){try{const s=JSON.parse(localStorage.getItem('fantaball-app')||'null');if(s&&s.teams)store={...store,...s}}catch(e){}
  if(!store.teams.length){store.teams=SEEDS.map((t,k)=>({id:'t'+k,name:t.name,players:t.ids,rules:mk(t.rules)}));store.cur=store.teams[0]?.id}
  for(const t of store.teams)t.rules=Object.assign(clone(RULES0),t.rules)}
function save(){try{localStorage.setItem('fantaball-app',JSON.stringify(store))}catch(e){}}
const team=()=>store.teams.find(t=>t.id===store.cur)||store.teams[0];

// ---------- outcomes ----------
function unpack(k){if(!(k>>>31))return{rated:false,yellow:k&1?1:0,red:k&2?1:0,any:k!==0};
  const v0=(k&15)+6;return{rated:true,any:true,vote2:[v0,v0+((k>>4)&15)-7,v0+((k>>8)&15)-7],goals:(k>>12)&7,penScored:(k>>15)&3,penMissed:(k>>17)&3,penSaved:(k>>19)&3,
    ownGoals:(k>>21)&3,assists:(k>>23)&7,yellow:(k>>26)&1,red:(k>>27)&1,ga:(k>>28)&7}}
const UK=new Map();const U=k=>{let o=UK.get(k);if(!o){o=unpack(k);UK.set(k,o)}return o};
function fv(o,role,R){if(!o.rated)return o.red&&R.noVoteRed!=null?R.noVoteRed:o.yellow&&R.noVoteYellow!=null?R.noVoteYellow:null;
  return o.vote2[R.provider]/2+o.goals*R.goal[role]+o.penScored*R.penScored+o.penMissed*R.penMissed+o.penSaved*R.penSaved+o.ownGoals*R.ownGoal
    +o.assists*R.assist+o.yellow*R.yellow+o.red*R.red+(o.ga?0:R.cs[role])+(role==='P'?o.ga*R.conceded:0)}
const drawsOf=p=>{if(!p._dr){const b=atob(p.dr),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);p._dr=new Uint32Array(u.buffer)}return p._dr};

// per-player stats under a rule set, from the exact outcome counts of all N simulated seasons
const statCache=new Map();
function stats(R){const key=JSON.stringify(R);if(statCache.has(key))return statCache.get(key);const S=new Map();
  for(const p of P){let nv=0,sum=0,g=0,a=0,y=0,rd=0,cs=0,vs=0,gb=0,ab=0,cb=0,cr=0;const vals=[],wts=[];
    for(let i=0;i<p.oc.length;i+=2){const o=U(p.oc[i]),c=p.oc[i+1],x=fv(o,p.role,R);
      if(o.yellow)y+=c;if(o.red)rd+=c;
      if(o.rated){if(o.goals+o.penScored>0)g+=c;if(o.assists>0)a+=c;if(!o.ga)cs+=c;vs+=o.vote2[R.provider]/2*c;
        gb+=(o.goals*R.goal[p.role]+o.penScored*R.penScored+o.penMissed*R.penMissed+o.penSaved*R.penSaved+o.ownGoals*R.ownGoal)*c;ab+=o.assists*R.assist*c;cb+=(o.yellow*R.yellow+o.red*R.red)*c;
        cr+=((o.ga?0:R.cs[p.role])+(p.role==='P'?o.ga*R.conceded:0))*c}
      if(x!=null){nv+=c;sum+=x*c;vals.push(x);wts.push(c)}}
    const rated=p.oc.reduce((t,v,i)=>i%2&&U(p.oc[i-1]).rated?t+v:t,0);
    const q=f=>{if(!vals.length)return null;const idx=vals.map((_,j)=>j).sort((u,v)=>vals[u]-vals[v]),t=Math.floor((nv-1)*f);let c=0;for(const j of idx){c+=wts[j];if(c>t)return vals[j]}return vals[idx.at(-1)]};
    S.set(p.id,{pVote:nv/N,xfm:nv?sum/nv:null,exp:sum/N,lo:q(.25),hi:q(.75),med:q(.5),pGoal:g/N,pAst:a/N,pYel:y/N,pRed:rd/N,pCS:rated?cs/rated:null,
      parts:rated?{vote:vs/rated,goals:gb/rated,assists:ab/rated,cards:cb/rated,keeper:cr/rated}:null})}
  statCache.set(key,S);return S}

// ---------- lineup and simulated match on the complete simulated rounds ----------
const fGoals=(x,R)=>x<R.goalFirst?0:1+Math.floor((x-R.goalFirst)/R.goalStep);
function prep(ids,R,out){const S=stats(R);return ids.map(id=>byId.get(id)).filter(p=>p&&!out.has(p.id)).map(p=>{const dr=drawsOf(p),f=new Float32Array(D),v=new Float32Array(D);
  for(let w=0;w<D;w++){const o=U(dr[w]);const x=o.any?fv(o,p.role,R):null;f[w]=x==null?NaN:x;v[w]=o.rated?o.vote2[R.provider]/2:NaN}
  return{p,role:p.role,f,v,exp:S.get(p.id).exp}})}
function play(xi,bench,R,w,cap){let subs=0,used=new Set(),pts=0,gk=null,dv=[],cnt={P:0,D:0,C:0,A:0},capV=null,vcV=null;xi.forEach(x=>cnt[x.role]++);
  const ok=new Set(R.forms),max=R.maxSubs<0?99:R.maxSubs;
  for(const s of xi){let p=s,x=s.f[w];
    if(x!==x&&subs<max){const cands=R.formationChange?bench.all:bench[s.role];
      for(const b of cands){if(used.has(b)||(b.role==='P')!==(s.role==='P'))continue;const y=b.f[w];if(y!==y)continue;
        if(b.role!==s.role){const c2={...cnt};c2[s.role]--;c2[b.role]++;if(!ok.has(`${c2.D}-${c2.C}-${c2.A}`))continue;cnt[s.role]--;cnt[b.role]++}
        used.add(b);subs++;p=b;x=y;break}}
    if(x===x){pts+=x;const v=p.v[w];if(p.role==='P')gk=v===v?v:null;else if(p.role==='D'&&v===v)dv.push(v);if(cap){if(s===cap[0]&&p===s)capV=v;if(s===cap[1]&&p===s)vcV=v}}}
  let m=0;if(R.defMod.on&&gk!=null&&dv.length>=R.defMod.min){const best=dv.sort((a,b)=>b-a).slice(0,3),avg=(gk+best.reduce((a,b)=>a+b,0))/(1+best.length);for(const [t,b] of [...R.defMod.bands].sort((a,b)=>a[0]-b[0]))if(avg>=t)m=b}
  let c=0;if(cap&&R.captain.on){const cv=capV===capV&&capV!=null?capV:vcV;if(cv!=null&&cv===cv)for(const [t,b] of [...R.captain.bands].sort((a,b)=>a[0]-b[0]))if(cv>=t)c=b}
  return{pts:pts+m+c,m,c}}
const comb=(a,k)=>k===0?[[]]:a.flatMap((x,i)=>comb(a.slice(i+1),k-1).map(r=>[x,...r]));
function best(t,outSet,home){const R=t.rules,pool=prep(t.players,R,outSet).filter(x=>x.exp>0.01),by={P:[],D:[],C:[],A:[]};pool.forEach(x=>by[x.role].push(x));for(const r of ROLES)by[r].sort((a,b)=>b.exp-a.exp);
  const cand=[];for(const f of R.forms){const [nd,nc,na]=f.split('-').map(Number);if(by.P.length<1||by.D.length<nd||by.C.length<nc||by.A.length<na)continue;
    for(const g of by.P.slice(0,2))for(const dd of comb(by.D.slice(0,7),nd))for(const cc of comb(by.C.slice(0,7),nc))for(const aa of comb(by.A.slice(0,6),na)){
      const xi=[g,...dd,...cc,...aa];cand.push({f,xi,pre:xi.reduce((s,x)=>s+x.exp,0)})}}
  cand.sort((a,b)=>b.pre-a.pre);const top=cand.slice(0,400);if(!top.length)return null;
  for(const c of top){const s=new Set(c.xi),bench={P:by.P.filter(x=>!s.has(x)),D:by.D.filter(x=>!s.has(x)),C:by.C.filter(x=>!s.has(x)),A:by.A.filter(x=>!s.has(x))};
    bench.all=[...bench.D,...bench.C,...bench.A].sort((a,b)=>b.exp-a.exp);const cap=[...c.xi].sort((a,b)=>b.exp-a.exp).slice(0,2);
    const pts=new Float64Array(D);let mm=0,cc=0;for(let w=0;w<D;w++){const r=play(c.xi,bench,R,w,cap);pts[w]=r.pts+(home?R.homeBonus:0);mm+=r.m;cc+=r.c}
    const mean=pts.reduce((a,b)=>a+b,0)/D;let vr=0,gs=0;const gd=new Array(5).fill(0);for(let w=0;w<D;w++){vr+=(pts[w]-mean)**2;const g=fGoals(pts[w],R);gs+=g;gd[Math.min(4,g)]++}
    Object.assign(c,{bench,cap,pts,mean,sd:Math.sqrt(vr/D),goals:gs/D,gd,mod:mm/D,capB:cc/D})}

// the three ways to choose: highest average points, most fantasy goals, mean-variance (average − λ × variance)

  const tog=(id,on)=>`<input class="tg" type="checkbox" id="${id}" ${on?'checked':''}>`;
  const bands=(key,arr)=>arr.map((b,i)=>row(`Media ≥ ${num(`${key}_t${i}`,b[0],.25)}`,num(`${key}_b${i}`,b[1]))).join('');
  $('#view').innerHTML=hero(esc(t.name),'Regole','Come si calcolano i punti in questa lega. Ogni modifica aggiorna subito xFM, formazione e gol.')+
  `<div class="sec-h"><span>Modello di partenza</span></div><div class="grp">${row('Preset',`<select class="sel" id="preset"><option value="">Scegli…</option>${Object.keys(PRESETS).map(k=>`<option>${k}</option>`).join('')}</select>`)}</div>
  <div class="sec-h"><span>Bonus e malus</span></div><div class="grp">${byRole('goal','Gol')}${row('Rigore segnato',num('penScored',R.penScored))}${row('Rigore sbagliato',num('penMissed',R.penMissed))}${row('Rigore parato',num('penSaved',R.penSaved),'portiere')}
    ${row('Autogol',num('ownGoal',R.ownGoal))}${row('Assist',num('assist',R.assist))}${row('Ammonizione',num('yellow',R.yellow))}${row('Espulsione',num('red',R.red))}
    ${row('Gol subito',num('conceded',R.conceded),'portiere, per gol')}${byRole('cs','Imbattibilità')}</div>
  <div class="sec-h"><span>In arrivo (servono dati o lavoro sul motore)</span></div><div class="grp">${row('Assist da fermo','=',"oggi vale come l'assist")}<div class="li dis"><span class="k">Gol vittoria · gol pareggio</span><span class="v">presto</span></div><div class="li dis"><span class="k">Migliore in campo</span><span class="v">presto</span></div></div>
  <div class="sec-h"><span>Senza voto e voti</span></div><div class="grp">${row('Espulso senza voto',num('noVoteRed',R.noVoteRed),'vuoto = nessun voto')}${row('Ammonito senza voto',num('noVoteYellow',R.noVoteYellow),'vuoto = nessun voto')}
    ${row('Fonte dei voti',`<select class="sel" id="provider">${['Fantacalcio','Statistico','Italia'].map((x,i)=>`<option value="${i}" ${R.provider===i?'selected':''}>${x}</option>`).join('')}</select>`)}</div>
  <div class="sec-h"><span>Modificatore difesa</span></div><div class="grp">${row('Attivo',tog('dm_on',R.defMod.on),'portiere + 3 migliori difensori, solo voto')}${row('Difensori minimi',num('dm_min',R.defMod.min,1))}${bands('dm',R.defMod.bands)}</div>
  <div class="sec-h"><span>Capitano</span></div><div class="grp">${row('Modificatore capitano',tog('cap_on',R.captain.on),'capitano = titolare con più punti attesi, poi il vice')}${bands('cap',R.captain.bands)}</div>
  <div class="sec-h"><span>Formazione e cambi</span></div><div class="grp">${row('Cambio modulo',tog('fchg',R.formationChange),'un panchinaro di altro ruolo può entrare se il modulo resta valido')}
    ${row('Sostituzioni',`<select class="sel" id="maxSubs">${[3,5,-1].map(v=>`<option value="${v}" ${R.maxSubs===v?'selected':''}>${v<0?'Illimitate':v}</option>`).join('')}</select>`)}
    ${row('Moduli consentiti',`<span class="filters" style="justify-content:flex-end">${FORMS.map(f=>`<button type="button" class="chipbtn" data-form="${f}" aria-pressed="${R.forms.includes(f)}">${f}</button>`).join('')}</span>`)}
    ${row('Rosa (giocatori per ruolo)',`<span class="roles4" style="max-width:220px">${ROLES.map(r=>`<label for="sq_${r}">${r}</label>`).join('')}${ROLES.map(r=>num(`sq_${r}`,R.squad[r],1)).join('')}</span>`)}</div>
  <div class="sec-h"><span>Partita</span></div><div class="grp">${row('Primo gol a',num('goalFirst',R.goalFirst,1),'punti')}${row('Un gol in più ogni',num('goalStep',R.goalStep,1),'punti')}${row('Fattore campo',num('homeBonus',R.homeBonus),'punti a chi gioca in casa')}</div>
  <p class="note">Fonti dei valori tipici: regolamenti Classic di Fantacalcio.it, FantaMaster e Fantacalcio-online. Il Mantra non è incluso.</p>`;
  const v=id=>{const x=$('#'+id).value;return x===''?null:+x};
  const apply=()=>{for(const r of ROLES){R.goal[r]=v('goal_'+r)??0;R.cs[r]=v('cs_'+r)??0;R.squad[r]=Math.max(1,v('sq_'+r)??RULES0.squad[r])}
    for(const k of ['penScored','penMissed','penSaved','ownGoal','assist','yellow','red','conceded','homeBonus'])R[k]=v(k)??0;
    R.noVoteRed=v('noVoteRed');R.noVoteYellow=v('noVoteYellow');R.provider=+$('#provider').value;R.goalFirst=v('goalFirst')??66;R.goalStep=Math.max(1,v('goalStep')??6);
    R.defMod.on=$('#dm_on').checked;R.defMod.min=v('dm_min')??4;R.defMod.bands=R.defMod.bands.map((_,i)=>[v('dm_t'+i)??0,v('dm_b'+i)??0]);
    R.captain.on=$('#cap_on').checked;R.captain.bands=R.captain.bands.map((_,i)=>[v('cap_t'+i)??0,v('cap_b'+i)??0]);
    R.formationChange=$('#fchg').checked;R.maxSubs=+$('#maxSubs').value;save()};
  $('#view').querySelectorAll('input,select:not(#preset)').forEach(el=>el.addEventListener('change',apply));
  $('#view').querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{const f=b.dataset.form,i=R.forms.indexOf(f);if(i>=0&&R.forms.length>1)R.forms.splice(i,1);else if(i<0)R.forms.push(f);b.setAttribute('aria-pressed',R.forms.includes(f));save()});
  $('#preset').onchange=e=>{if(!e.target.value)return;t.rules=Object.assign(mk(PRESETS[e.target.value]),{squad:R.squad});save();viewRules()}}

// ---------- tab: Giornata ----------
let opp='';
function viewRound(){const t=team();
  $('#view').innerHTML=hero(`Giornata ${M.round} · ${esc(t?.name||'')}`,'Formazione','La migliore formazione, il punteggio atteso e quanti gol puoi fare, simulando la giornata.')+
  `<div class="sec-h"><span>Squadra</span></div><div class="teams">${store.teams.map(x=>`<button class="chipbtn" type="button" data-team="${x.id}" aria-pressed="${x.id===t?.id}">${esc(x.name)}</button>`).join('')}</div>
  <div id="rres"><div class="empty">Calcolo in corso…</div></div>`;
  document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{store.cur=b.dataset.team;save();render()});
  if(!t)return;setTimeout(()=>computeRound(t),20)}
function computeRound(t){const R=t.rules,outs=new Set((store.out[t.id]||[]).concat(t.players.filter(id=>byId.get(id)?.out>0)));const home=!!(store.home?.[t.id]);
  if(t.players.length<11){$('#rres').innerHTML='<div class="empty">Servono almeno 11 giocatori: aggiungili in Squadre.</div>';return}
  const res=best(t,outs,home);if(!res){$('#rres').innerHTML='<div class="empty">Nessuna formazione valida con i moduli consentiti e i giocatori disponibili.</div>';return}
  const crit=store.crit?.[t.id]||'mean',lam=Math.round((store.lam?.[t.id]??0)*10)/10,ranked=pick(res.top,crit,lam),b=ranked[0],S=stats(R),gd=b.gd;
  const perForm=R.forms.map(f=>ranked.find(c=>c.f===f)).filter(Boolean),three=Object.keys(CRIT).map(k=>[k,pick(res.top,k,lam)[0]]);
  const sorted=Float64Array.from(b.pts).sort(),q=f=>sorted[Math.floor((D-1)*f)];
  let oppHtml='';const ot=store.teams.find(x=>x.id===opp&&x.id!==t.id);
  if(ot){const outs2=new Set((store.out[ot.id]||[]).concat(ot.players.filter(id=>byId.get(id)?.out>0)));const r2x=best({...ot,rules:R},outs2,false),r2=r2x&&{best:pick(r2x.top,'mean',0)[0]};
    if(r2){let w=0,d=0,l=0;for(let i=0;i<D;i++){const a=fGoals(b.pts[i],R),c=fGoals(r2.best.pts[i],R);a>c?w++:a<c?l++:d++}
      oppHtml=`<div class="grp split"><div class="seg2"><i style="width:${w/D*100}%;background:var(--green)"></i><i style="width:${d/D*100}%;background:var(--label3)"></i><i style="width:${l/D*100}%;background:var(--red)"></i></div>
      <div class="legend"><span style="--c:var(--green)">Vittoria ${pct(w/D)}</span><span style="--c:var(--label3)">Pareggio ${pct(d/D)}</span><span style="--c:var(--red)">Sconfitta ${pct(l/D)}</span></div>
      <div class="note" style="padding:0">${esc(ot.name)}: ${it(r2.best.mean,1)} punti attesi con ${r2.best.f}, con le regole di ${esc(t.name)}.</div></div>`}}
  const capOn=R.captain.on?` · capitano ${esc(b.cap[0].p.name)}, vice ${esc(b.cap[1].p.name)}`:'';
  const benchList=R.formationChange?[...b.bench.P,...b.bench.all]:ROLES.flatMap(r=>b.bench[r]);
  $('#rres').innerHTML=`<div class="sec-h"><span>Criterio di scelta</span></div><div class="grp" style="padding:12px 14px;display:grid;gap:10px">
    <div class="seg" id="crit" style="width:100%;grid-auto-columns:1fr">${Object.entries(CRIT).map(([k,v])=>`<button type="button" data-c="${k}" aria-pressed="${crit===k}">${v.lab}</button>`).join('')}</div>
    <div class="note" style="padding:0">${crit==='mean'?'La formazione con il punteggio medio più alto.':crit==='goals'?'La formazione con più gol fanta in media (primo gol a '+R.goalFirst+', poi uno ogni '+R.goalStep+'): premia chi supera le soglie più spesso.':'Portafoglio media-varianza: massimizza media − λ × varianza del punteggio. λ positivo = formazione più regolare (avverso al rischio); λ negativo = premia la variabilità, per quando serve un punteggio alto (amante del rischio).'}</div>
    ${crit==='mv'?`<label class="li" style="padding:0;min-height:0" for="lam"><span class="k">Avversione al rischio λ <b>${it(lam,2)}</b><small>${lam<0?"amante del rischio":lam>0?"avverso al rischio":"neutrale"} · negativo = cerca il colpo grosso · 0 = solo media · positivo = più regolare</small></span><input id="lam" type="range" min="-0.3" max="0.3" step="0.1" value="${lam}" list="lamticks"><datalist id="lamticks"><option value="-0.3"></option><option value="-0.2"></option><option value="-0.1"></option><option value="0"></option><option value="0.1"></option><option value="0.2"></option><option value="0.3"></option></datalist style="width:45%"></label>`:''}</div>
  <div class="sec-h"><span>Risultato atteso</span></div><div class="hero2">
    <div class="big"><span class="k">Punti attesi</span><span class="v main">${it(b.mean,1)}</span><span class="s">range ${it(q(.25),1)}–${it(q(.75),1)} · σ ${it(b.sd,1)}</span></div>
    <div class="big"><span class="k">Modulo</span><span class="v">${b.f}</span><span class="s">${R.defMod.on?'modificatore +'+it(b.mod,1):'senza modificatore'}</span></div>
    <div class="big"><span class="k">Gol attesi</span><span class="v">${it(b.goals,2)}</span><span class="s">primo a ${R.goalFirst}, poi ogni ${R.goalStep}</span></div></div>
  <div class="sec-h"><span>Quanti gol fai</span><span>${D} giornate simulate</span></div><div class="grp bars">${gd.map((c,i)=>`<div class="barrow"><span>${i===4?'4+ gol':i+(i===1?' gol':' gol')}</span><span class="tr"><i style="width:${(c/D*100).toFixed(1)}%"></i></span><span>${pct(c/D)}</span></div>`).join('')}</div>
  <div class="sec-h"><span>Titolari${capOn}</span></div><div class="list xi">${b.xi.map(x=>{const s=S.get(x.p.id);return `<div class="row" style="cursor:default"><div class="role ${x.role}">${x.role}</div><div class="who"><div class="nm"><span>${esc(x.p.name)}</span>${badge(x.p)}</div><div class="mt">${esc(x.p.team)} · ${x.p.home?'vs':'a'} ${esc(x.p.opp||'–')}</div></div>
    <div class="num"><div class="xfm">${it(s.xfm,2)}<small>xFM</small></div><div class="vp">${pct(s.pVote)}<span class="meter"><i style="width:${Math.round(s.pVote*100)}%;background:${meterColor(s.pVote)}"></i></span></div></div></div>`}).join('')}</div>
  <div class="sec-h"><span>Panchina, in ordine${R.formationChange?' (cambio modulo)':' per ruolo'}</span></div><div class="grp">${benchList.map((x,i)=>`<div class="li"><span class="k">${i+1}. ${esc(x.p.name)} <small>${x.role} · ${esc(x.p.team)}</small></span><span class="v">${pct(S.get(x.p.id).pVote)}</span></div>`).join('')||'<div class="empty">Nessuno</div>'}</div>
  <div class="sec-h"><span>Confronto dei tre criteri</span></div><div class="list">${three.map(([k,c])=>`<div class="li" style="flex-wrap:wrap"><span class="k"><b>${CRIT[k].lab}</b>${k===crit?' · scelto':''}<small>${c.f} · ${esc(c.xi.filter(x=>!b.xi.includes(x)).map(x=>x.p.name).join(', ')||'stessi titolari')}${c.xi.some(x=>!b.xi.includes(x))?' al posto di '+esc(b.xi.filter(x=>!c.xi.includes(x)).map(x=>x.p.name).join(', ')):''}</small></span>
    <span class="v">${it(c.mean,1)} pt · σ ${it(c.sd,1)} · ${it(c.goals,2)} gol<br><small>≥ 2 gol ${pct((c.gd[2]+c.gd[3]+c.gd[4])/D)}</small></span></div>`).join('')}</div>
  <div class="sec-h"><span>Altri moduli (stesso criterio)</span></div><div class="grp">${perForm.map(c=>`<div class="li"><span class="k">${c.f}</span><span class="v">${it(c.mean,1)} pt · ${it(c.goals,2)} gol · σ ${it(c.sd,1)}</span></div>`).join('')}</div>
  <div class="sec-h"><span>Avversario</span></div><div class="grp">${'<div class="li"><span class="k">Gioca contro</span><select class="sel" id="opp"><option value="">Nessuno</option>'+store.teams.filter(x=>x.id!==t.id).map(x=>`<option value="${x.id}" ${opp===x.id?'selected':''}>${esc(x.name)}</option>`).join('')+'</select></div>'}
    <div class="li"><span class="k">Gioco in casa<small>fattore campo ${it(R.homeBonus,1)}</small></span><input class="tg" type="checkbox" id="home" ${store.home?.[t.id]?'checked':''}></div></div>${oppHtml}
  <div class="sec-h"><span>Indisponibili (ultime notizie)</span></div><div class="grp">${t.players.map(id=>byId.get(id)).filter(Boolean).sort((a,b2)=>ROLES.indexOf(a.role)-ROLES.indexOf(b2.role)).map(p=>{const auto=p.out>0,on=auto||(store.out[t.id]||[]).includes(p.id);
    return `<div class="li"><span class="k">${esc(p.name)} <small>${p.role} · ${esc(p.team)}${auto?' · infortunato (lista Fantacalcio)':''}</small></span><input class="tg" type="checkbox" data-out="${p.id}" ${on?'checked':''} ${auto?'disabled':''} aria-label="${esc(p.name)} fuori"></div>`}).join('')}</div>
  <p class="note">Formazione scelta con il criterio indicato tra tutte quelle possibili, simulando ${D} giornate complete (stessa partita reale per tutti i giocatori): cambi dalla panchina${R.maxSubs<0?'':' (max '+R.maxSubs+')'}, modificatore difesa e capitano come da Regole. Con ${D} giornate le medie hanno un margine di circa ±0,5 punti. Probabilità e xFM dei singoli giocatori usano tutte le ${N.toLocaleString('it-IT')} stagioni simulate.</p>`;
  $('#opp').onchange=e=>{opp=e.target.value;computeRound(t)};
  $('#crit').onclick=e=>{const x=e.target.closest('button');if(!x)return;store.crit={...(store.crit||{}),[t.id]:x.dataset.c};save();computeRound(t)};
  $('#lam')&&($('#lam').onchange=e=>{store.lam={...(store.lam||{}),[t.id]:+e.target.value};save();computeRound(t)});
  $('#home').onchange=e=>{store.home={...(store.home||{}),[t.id]:e.target.checked};save();computeRound(t)};
  document.querySelectorAll('[data-out]').forEach(c=>c.onchange=()=>{const id=+c.dataset.out,a=new Set(store.out[t.id]||[]);c.checked?a.add(id):a.delete(id);store.out[t.id]=[...a];save();$('#rres').innerHTML='<div class="empty">Ricalcolo…</div>';setTimeout(()=>computeRound(t),20)})}

// ---------- router ----------
const VIEWS={giocatori:viewPlayers,squadre:viewTeams,regole:viewRules,giornata:viewRound};
function render(){const tab=VIEWS[store.tab]?store.tab:'giornata';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));VIEWS[tab]()}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.tab=b.dataset.tab;save();window.scrollTo(0,0);render()};
load();if(location.hash&&VIEWS[location.hash.slice(1)])store.tab=location.hash.slice(1);render();
</script>
